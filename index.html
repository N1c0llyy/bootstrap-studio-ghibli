<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paisagens Inspiradas no Studio Ghibli</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8f9fa;
    }

    .titulo-principal {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      font-weight: 500;
    }

    
    .carousel-topo {
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      background-color: #000;
    }

    .carousel-item img {
      height: 340px;
      width: 100%;
      object-fit: contain; 
      background-color: #000;
    }

    .card {
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.18);
    }

    .card-img-top {
      height: 190px;
      object-fit: cover;
    }

    .estrela {
      font-size: 1.3rem;
      text-align: center;
      color: #6c757d;
    }
  </style>
</head>

<body>


<div class="container mt-4 mb-5">
  <div id="ghibliCarousel"
       class="carousel slide carousel-topo"
       data-bs-ride="carousel"
       data-bs-interval="2500">

    <div class="carousel-inner">
      <div class="carousel-item active"><img src="imagens/img1.gif"></div>
      <div class="carousel-item"><img src="imagens/img2.gif"></div>
      <div class="carousel-item"><img src="imagens/img3.gif"></div>
      <div class="carousel-item"><img src="imagens/img4.gif"></div>
      <div class="carousel-item"><img src="imagens/img5.gif"></div>
      <div class="carousel-item"><img src="imagens/img6.gif"></div>
      <div class="carousel-item"><img src="imagens/img7.gif"></div>
      <div class="carousel-item"><img src="imagens/img8.gif"></div>
      <div class="carousel-item"><img src="imagens/img9.gif"></div>
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#ghibliCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#ghibliCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>

  </div>
</div>


<div class="container mb-5">
  <h1 class="text-center mb-4 titulo-principal">Galeria</h1>

  <div class="row g-4">

    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm">
        <img src="imagens/img1.gif" class="card-img-top">
        <div class="card-body"><div class="estrela"><i class="bi bi-star"></i></div></div>
      </div>
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm">
        <img src="imagens/img2.gif" class="card-img-top">
        <div class="card-body"><div class="estrela"><i class="bi bi-star"></i></div></div>
      </div>
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm">
        <img src="imagens/img3.gif" class="card-img-top">
        <div class="card-body"><div class="estrela"><i class="bi bi-star"></i></div></div>
      </div>
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm">
        <img src="imagens/img4.gif" class="card-img-top">
        <div class="card-body"><div class="estrela"><i class="bi bi-star"></i></div></div>
      </div>
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm">
        <img src="imagens/img5.gif" class="card-img-top">
        <div class="card-body"><div class="estrela"><i class="bi bi-star"></i></div></div>
      </div>
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm">
        <img src="imagens/img6.gif" class="card-img-top">
        <div class="card-body"><div class="estrela"><i class="bi bi-star"></i></div></div>
      </div>
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm">
        <img src="imagens/img7.gif" class="card-img-top">
        <div class="card-body"><div class="estrela"><i class="bi bi-star"></i></div></div>
      </div>
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm">
        <img src="imagens/img8.gif" class="card-img-top">
        <div class="card-body"><div class="estrela"><i class="bi bi-star"></i></div></div>
      </div>
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm">
        <img src="imagens/img9.gif" class="card-img-top">
        <div class="card-body"><div class="estrela"><i class="bi bi-star"></i></div></div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
